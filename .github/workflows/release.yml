name: Release Features

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish Features and generate documentation
        uses: devcontainers/action@v1
        with:
          publish-features: true
          base-path-to-features: ./src
          generate-docs: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open generated-documentation pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- 'src/*/README.md'; then
            exit 0
          fi
          branch="automation/feature-docs-${GITHUB_RUN_ID}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git switch -c "$branch"
          git add 'src/*/README.md'
          git commit -m "docs: update generated Feature documentation"
          git push origin "$branch"
          gh pr create --title "docs: update generated Feature documentation" --body "Generated by the Feature release workflow."
