name: Test Features

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-defaults:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: just
            image: debian:bookworm
          - feature: just
            image: ubuntu:24.04
          - feature: just
            image: alpine:3.22
          - feature: codex-cli
            image: debian:bookworm
          - feature: codex-cli
            image: ubuntu:24.04
          - feature: playwright-cli
            image: debian:bookworm
          - feature: playwright-cli
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test ${{ matrix.feature }} on ${{ matrix.image }}
        run: npm exec -- devcontainer features test --skip-scenarios -f "${{ matrix.feature }}" -i "${{ matrix.image }}" .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [codex-cli, playwright-cli]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test ${{ matrix.feature }} scenarios
        run: npm exec -- devcontainer features test -f "${{ matrix.feature }}" --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -- devcontainer features test --global-scenarios-only .
